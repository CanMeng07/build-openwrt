name: 当前设备 OpenWrt 25.12.5 完整固件

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl xz-utils zstd mtd-utils squashfs-tools
      - name: 缓存公开下载和编译器缓存
        uses: actions/cache@v4
        with:
          path: |
            config/openwrt25.12.5-ipq60xx/cache/downloads
            config/openwrt25.12.5-ipq60xx/cache/ccache
          key: ${{ runner.os }}-ubuntu24-ipq60xx-v25.12.5-${{ hashFiles('config/openwrt25.12.5-ipq60xx/config.seed', 'config/openwrt25.12.5-ipq60xx/board/**', 'config/openwrt25.12.5-ipq60xx/packages/**/Makefile', 'config/openwrt25.12.5-ipq60xx/scripts/**') }}
      - name: 验证依赖和Ruby配置生成
        env:
          ZN_M2_BOARD_DATA_GZ_B64: ${{ secrets.ZN_M2_BOARD_DATA_GZ_B64 }}
        run: bash config/openwrt25.12.5-ipq60xx/scripts/build.sh --prepare
      - name: 编译完整固件
        run: bash config/openwrt25.12.5-ipq60xx/scripts/build.sh --compile
      - name: 保存软件包、配置和完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 当前设备-OpenWrt25.12.5-完整固件
          path: |
            config/openwrt25.12.5-ipq60xx/logs/
            config/openwrt25.12.5-ipq60xx/output/
            config/openwrt25.12.5-ipq60xx/work/openwrt/.config
            config/openwrt25.12.5-ipq60xx/work/openwrt/bin/packages/
            config/openwrt25.12.5-ipq60xx/work/openwrt/bin/targets/qualcommax/ipq60xx/packages/
          if-no-files-found: warn
          retention-days: 14
