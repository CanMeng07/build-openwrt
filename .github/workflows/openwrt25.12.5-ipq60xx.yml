name: OpenWrt 25.12.5 编译验证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl xz-utils zstd
      - name: 编译目标平台和插件
        run: bash config/openwrt25.12.5-ipq60xx/scripts/build.sh
      - name: 保存软件包、配置和完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt25.12.5-编译验证
          path: |
            config/openwrt25.12.5-ipq60xx/logs/
            config/openwrt25.12.5-ipq60xx/work/openwrt/.config
            config/openwrt25.12.5-ipq60xx/work/openwrt/bin/packages/
            config/openwrt25.12.5-ipq60xx/work/openwrt/bin/targets/qualcommax/ipq60xx/packages/
          if-no-files-found: warn
          retention-days: 14
